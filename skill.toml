pt = "Pagamentos no Brasil sem incidente financeiro: PIX (cobrança, QR dinâmico, devolução, webhook), boleto, cartão sem tocar PAN (SAQ A), dinheiro em centavos, ledger de dupla entrada, máquina de estados, webhooks idempotentes, split, conciliação, NF-e/NFS-e e nunca cobrar fora de prd."
